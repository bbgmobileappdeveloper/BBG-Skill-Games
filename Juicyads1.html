<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Space</title>
    
    <!-- STRICT ANTI-CACHING META HEADERS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #080808;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #ad-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* Critical Warning Display */
        .critical-warning {
            display: none;
            text-align: center;
            padding: 30px;
            background-color: #1a0505;
            border: 2px solid #ff3333;
            border-radius: 12px;
            max-width: 85%;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.4);
        }
        .critical-warning h2 {
            color: #ff3333;
            font-size: 1.4rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .critical-warning p {
            color: #dddddd;
            font-size: 1rem;
            margin-bottom: 18px;
        }
        .retry-btn {
            background-color: #ff3333;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="ad-container">
        <!-- Critical Warning Banner -->
        <div id="offline-warning" class="critical-warning">
            <h2>CRITICAL WARNING</h2>
            <p>No Internet found. Connect to Internet First and then play.</p>
            <button class="retry-btn" onclick="retryConnection()">Retry Connection</button>
        </div>
    </div>

    <script>
        // 1. CLEAR ANY PREVIOUS CACHE IMMEDIATELY ON LOAD
        clearAllPageCache();

        function clearAllPageCache() {
            // Clear Web Storage
            if (window.localStorage) localStorage.clear();
            if (window.sessionStorage) sessionStorage.clear();

            // Clear Cache API Storage (if supported by Webview)
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (let name of names) {
                        caches.delete(name);
                    }
                });
            }
        }

        function verifyAndLoadAd() {
            // Check basic navigator state
            if (!navigator.onLine) {
                showCriticalWarning();
                return; // PAUSE & STOP EXECUTION
            }

            // Perform live network ping check
            var cacheBuster = Date.now();
            fetch('https://js.juicyads.com/juicyads.native-ads.min.js?ping=' + cacheBuster, { 
                method: 'HEAD', 
                mode: 'no-cors',
                cache: 'no-store'
            })
            .then(function() {
                // Connection confirmed: inject and play ads
                hideWarning();
                injectJuicyAdsScript(cacheBuster);
            })
            .catch(function() {
                // Ping failed: network issue present
                showCriticalWarning();
            });
        }

        function showCriticalWarning() {
            document.getElementById('offline-warning').style.display = 'block';
            // Wipe any cached memory state
            clearAllPageCache();
        }

        function hideWarning() {
            document.getElementById('offline-warning').style.display = 'none';
        }

        function retryConnection() {
            hideWarning();
            verifyAndLoadAd();
        }

        function injectJuicyAdsScript(cacheBuster) {
            var script = document.createElement('script');
            script.type = 'text/javascript';
            script.setAttribute('data-id', 'juicyads-native-ads');
            script.setAttribute('data-ad-zone', '1124022');
            script.setAttribute('data-targets', 'a');
            
            // Append dynamic cache-buster parameter
            script.src = 'https://js.juicyads.com/juicyads.native-ads.min.js?cb=' + cacheBuster;

            document.getElementById('ad-container').appendChild(script);
        }

        // Wipe cache again if the user or app navigates away/closes page
        window.addEventListener('beforeunload', clearAllPageCache);
        window.addEventListener('unload', clearAllPageCache);

        // Run validation as soon as DOM is ready
        window.addEventListener('DOMContentLoaded', verifyAndLoadAd);
    </script>
</body>
</html>
