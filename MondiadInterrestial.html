<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Space - Mondiad</title>
    
    <!-- STRICT ANTI-CACHING META HEADERS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #080808;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #ad-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
        }
        
        /* Warning Banners */
        .status-box {
            display: none;
            text-align: center;
            padding: 25px;
            background-color: #1a0505;
            border: 2px solid #ff3333;
            border-radius: 12px;
            max-width: 85%;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.4);
        }
        .status-box h2 {
            color: #ff3333;
            font-size: 1.3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .status-box p {
            color: #dddddd;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }
        .retry-btn {
            background-color: #ff3333;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="ad-wrapper">
        <!-- Critical Warning Banner -->
        <div id="offline-warning" class="status-box">
            <h2>CRITICAL WARNING</h2>
            <p>No Internet found. Connect to Internet First and then play.</p>
            <button class="retry-btn" onclick="retryConnection()">Retry Connection</button>
        </div>

        <!-- Mondiad Script Injection Point -->
        <div id="mondiad-target"></div>
    </div>

    <script>
        // 1. Clear local cache immediately on startup
        clearAllPageCache();

        function clearAllPageCache() {
            if (window.localStorage) localStorage.clear();
            if (window.sessionStorage) sessionStorage.clear();
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (let name of names) {
                        caches.delete(name);
                    }
                });
            }
        }

        function verifyAndLoadAd() {
            // Check basic navigator online status
            if (!navigator.onLine) {
                showCriticalWarning();
                return;
            }

            // Ping host domain to confirm internet connection
            var cacheBuster = Date.now();
            var pingUrl = window.location.origin + window.location.pathname + '?ping=' + cacheBuster;

            fetch(pingUrl, { 
                method: 'HEAD', 
                cache: 'no-store' 
            })
            .then(function(response) {
                if (response.ok || response.type === 'opaque') {
                    hideWarning();
                    injectMondiadAd(cacheBuster);
                } else {
                    showCriticalWarning();
                }
            })
            .catch(function() {
                showCriticalWarning();
            });
        }

        function showCriticalWarning() {
            document.getElementById('offline-warning').style.display = 'block';
            clearAllPageCache();
        }

        function hideWarning() {
            document.getElementById('offline-warning').style.display = 'none';
        }

        function retryConnection() {
            hideWarning();
            verifyAndLoadAd();
        }

        function injectMondiadAd(cacheBuster) {
            var targetContainer = document.getElementById('mondiad-target');
            targetContainer.innerHTML = ''; // Clean container

            var script = document.createElement('script');
            script.type = 'text/javascript';
            script.async = true;
            script.setAttribute('data-mndintid', '2ef58810-d585-4fba-ba2a-bb2adcd29ff7');
            
            // Dynamic cache-busting timestamp URL
            script.src = 'https://ss.mrmnd.com/interstitial.js?cb=' + cacheBuster;

            script.onerror = function() {
                console.warn('Mondiad script was blocked by browser ad blocker / tracking protection.');
            };

            targetContainer.appendChild(script);
        }

        // Wipe cache when leaving/closing the page
        window.addEventListener('beforeunload', clearAllPageCache);
        window.addEventListener('unload', clearAllPageCache);

        // Run validation as soon as DOM is ready
        window.addEventListener('DOMContentLoaded', verifyAndLoadAd);
    </script>
</body>
</html>
