<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adcash Interstitial</title>

    <!-- ANTI-CACHE META HEADERS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }
    </style>

    <!-- Step 1: Include Adcash library (Explicit HTTPS) -->
    <script id="aclib" type="text/javascript" src="https://acscdn.com/script/aclib.js"></script>
</head>
<body>

    <!-- Step 2: Run Interstitial Trigger -->
    <script type="text/javascript">
        aclib.runInterstitial({
            zoneId: '11964350',
        });
    </script>

</body>
</html>
