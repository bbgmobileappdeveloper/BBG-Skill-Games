<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ad Space - Adcash Interstitial</title>

    <!-- STRICT ANTI-CACHING META HEADERS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }
        #ad-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>

    <!-- Step 1: Include Adcash library (Explicit HTTPS) -->
    <script id="aclib" type="text/javascript" src="https://acscdn.com/script/aclib.js"></script>
</head>
<body>

    <div id="ad-container"></div>

    <!-- Step 2: Trigger Adcash Interstitial -->
    <script type="text/javascript">
        if (typeof aclib !== 'undefined' && aclib.runInterstitial) {
            aclib.runInterstitial({
                zoneId: '11964350'
            });
        }
    </script>

</body>
</html>
