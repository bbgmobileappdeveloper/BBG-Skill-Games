<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BBG Skill Games — Interstitial Ad</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0f172a; /* Matches game staging theme */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .interstitial-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 10px;
    }

    /* Standard fallback styling for native interstitial containers */
    .juicyads-native-container {
      width: 100% !important;
      max-width: 480px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div class="interstitial-wrapper">
    <!-- BEGIN JUICYADS NATIVE INTERSTITIAL (ZONE 1124022) -->
    <script type="text/javascript" 
            data-id="juicyads-native-ads" 
            data-ad-zone="1124022" 
            data-targets="a" 
            src="https://js.juicyads.com/juicyads.native-ads.min.js">
    </script>
    <!-- END JUICYADS NATIVE INTERSTITIAL -->
  </div>

</body>
</html>
