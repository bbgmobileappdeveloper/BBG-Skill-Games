<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBG-Skill-Games Studio — Mondiad UAT Hub</title>

  <!-- MONDIAD SITE VERIFICATION -->
  <meta name="mnd-ver" content="gohi8txg4bwvmft0pylolg" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      padding-bottom: 150px; /* Space for bottom banner */
    }

    .header-box {
      border: 2px solid #ff4757;
      background-color: #1e293b;
      padding: 20px;
      border-radius: 10px;
      max-width: 600px;
      margin: 0 auto 25px auto;
    }

    .uat-badge {
      background: #ff4757;
      color: #fff;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 12px;
    }

    h1 {
      color: #38bdf8;
      font-size: 22px;
      margin-top: 10px;
    }

    p {
      color: #94a3b8;
      font-size: 14px;
    }

    .button-container {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      background-color: #38bdf8;
      color: #0f172a;
      font-size: 15px;
      font-weight: bold;
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn:active {
      transform: scale(0.98);
    }

    #status-msg {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
      color: #34d399;
      min-height: 24px;
    }

    .ad-display-box {
      max-width: 600px;
      margin: 20px auto;
      padding: 15px;
      border: 1px dashed #38bdf8;
      border-radius: 8px;
      background: #1e293b;
      display: none;
    }

    /* FIXED BOTTOM BANNER */
    .bottom-banner-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      min-height: 90px;
      background: #1e293b;
      border-top: 2px solid #38bdf8;
      padding: 10px 0;
      text-align: center;
      z-index: 99999;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header-box">
    <span class="uat-badge">UAT STAGING HUB</span>
    <h1>Mondiad Ad Formats Testing</h1>
    <p>Select a category below to execute and test the ad format.</p>
  </div>

  <!-- 6 TEST BUTTONS -->
  <div class="button-container">
    <button class="btn" onclick="runNative()">1. Test Native Ad (Zone 80632)</button>
    <button class="btn" onclick="runInterstitial()">2. Test Interstitial Ad (Zone 80627)</button>
    <button class="btn" onclick="runPopunder()">3. Test Popunder Ad (Zone 80628)</button>
    <button class="btn" onclick="runDynamic()">4. Test Dynamic Ad (Zone 80629)</button>
    <button class="btn" onclick="runInPagePush()">5. Test In-Page Push (Zone 80630)</button>
    <button class="btn" onclick="runClassicPush()">6. Test Classic Push (Zone 80631)</button>

    <div id="status-msg"></div>
  </div>

  <!-- NATIVE AD CONTAINER -->
  <div id="native-box" class="ad-display-box">
    <p style="color: #94a3b8; font-size: 12px; margin-bottom: 10px;">Native Ad Slot (Zone 80632)</p>
    <div data-mndazid="728b68f4-f99e-412b-a097-86849878ecc1"></div>
  </div>

  <!-- DYNAMIC AD CONTAINER -->
  <div id="dynamic-box" class="ad-display-box">
    <p style="color: #94a3b8; font-size: 12px; margin-bottom: 10px;">Dynamic Floating Slot (Zone 80629)</p>
    <div data-mnddynid="553a1e5c-81ac-4251-9fd7-47dec91a951f"></div>
  </div>

  <!-- STICKY BOTTOM BANNER -->
  <div class="bottom-banner-container">
    <div style="font-size: 11px; color: #94a3b8; margin-bottom: 4px;">Mondiad Banner Ad (Zone 80626)</div>
    <div data-mndbanid="f18edcb6-dc5d-4230-ae93-257025a20165"></div>
    <!-- Script placed directly inside container for reliable execution -->
    <script src="https://ss.mrmnd.com/banner.js"></script>
  </div>

  <script>
    function updateStatus(msg) {
      document.getElementById('status-msg').innerText = msg;
    }

    function appendAdScript(src, attrs = {}) {
      const s = document.createElement('script');
      s.src = src;
      for (const [key, val] of Object.entries(attrs)) {
        s.setAttribute(key, val);
      }
      document.body.appendChild(s);
    }

    // 1. Native Ad
    function runNative() {
      document.getElementById('native-box').style.display = 'block';
      appendAdScript('https://ss.mrmnd.com/native.js');
      updateStatus('⚡ Native Ad triggered.');
    }

    // 2. Interstitial Ad
    function runInterstitial() {
      appendAdScript('https://ss.mrmnd.com/interstitial.js', { 'data-mndintid': '2ef58810-d585-4fba-ba2a-bb2adcd29ff7' });
      updateStatus('⚡ Interstitial script attached.');
    }

    // 3. Popunder Ad
    function runPopunder() {
      appendAdScript('https://ss.mrmnd.com/popunder.js', { 'data-mndpopid': '962e6f8c-77c1-4e17-bc44-b48a82991414' });
      updateStatus('⚡ Popunder active — click anywhere on the page to test.');
    }

    // 4. Dynamic Ad
    function runDynamic() {
      document.getElementById('dynamic-box').style.display = 'block';
      appendAdScript('https://ss.mrmnd.com/dynamic.js');
      updateStatus('⚡ Dynamic Ad script attached.');
    }

    // 5. In-Page Push
    function runInPagePush() {
      appendAdScript('https://ss.mrmnd.com/static/6b5cc626-dcfa-42c8-9bfd-ee7ba8e4fc30.js');
      updateStatus('⚡ In-Page Push script loaded.');
    }

    // 6. Classic Push
    function runClassicPush() {
      appendAdScript('https://ss.mrmnd.com/static/49ef5365-1fc7-4d28-8a6c-681b152fb256.js');
      updateStatus('⚡ Classic Push request initiated.');
    }
  </script>

</body>
</html>
