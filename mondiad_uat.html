<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBG-Skill-Games Studio — Mondiad UAT Test Hub</title>

  <!-- MONDIAD SITE VERIFICATION -->
  <meta name="mnd-ver" content="gohi8txg4bwvmft0pylolg" />

  <!-- ALWAYS ACTIVE: BANNER SCRIPT (ZONE 80626) -->
  <script async src="https://ss.mrmnd.com/banner.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      padding-bottom: 140px; /* Space for sticky bottom banner */
    }

    .header-box {
      border: 2px solid #ff4757;
      background-color: #1e293b;
      padding: 20px;
      border-radius: 10px;
      max-width: 600px;
      margin: 0 auto 30px auto;
    }

    .uat-badge {
      background: #ff4757;
      color: #fff;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 1px;
    }

    h1 {
      color: #38bdf8;
      font-size: 22px;
      margin-top: 10px;
      margin-bottom: 6px;
    }

    p {
      color: #94a3b8;
      font-size: 14px;
    }

    .button-container {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn {
      background-color: #38bdf8;
      color: #0f172a;
      font-size: 16px;
      font-weight: bold;
      padding: 16px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .btn:hover {
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn:active {
      transform: scale(0.98);
    }

    #status-msg {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
      color: #34d399;
      min-height: 24px;
    }

    .native-box {
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
      border: 1px dashed #38bdf8;
      border-radius: 8px;
      background: #1e293b;
      display: none;
    }

    /* STICKY BOTTOM BANNER */
    .bottom-banner-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #1e293b;
      border-top: 2px solid #38bdf8;
      padding: 10px 0;
      text-align: center;
      z-index: 99999;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header-box">
    <span class="uat-badge">UAT STAGING HUB</span>
    <h1>Mondiad Ad Formats Testing</h1>
    <p>Click any button below to trigger and test that specific ad format.</p>
  </div>

  <!-- 6 TEST BUTTONS -->
  <div class="button-container">
    <button class="btn" onclick="triggerNative()">1. Test Native Ad (Zone 80632)</button>
    <button class="btn" onclick="triggerInterstitial()">2. Test Interstitial Ad (Zone 80627)</button>
    <button class="btn" onclick="triggerPopunder()">3. Test Popunder Ad (Zone 80628)</button>
    <button class="btn" onclick="triggerDynamic()">4. Test Dynamic Ad (Zone 80629)</button>
    <button class="btn" onclick="triggerInPagePush()">5. Test In-Page Push (Zone 80630)</button>
    <button class="btn" onclick="triggerClassicPush()">6. Test Classic Push (Zone 80631)</button>

    <div id="status-msg"></div>
  </div>

  <!-- NATIVE AD CONTAINER (EXPANDS BELOW BUTTONS) -->
  <div id="native-container" class="native-box">
    <p style="color: #94a3b8; font-size: 12px; margin-bottom: 10px;">Native Ad Placement (Zone 80632)</p>
    <div data-mndazid="728b68f4-f99e-412b-a097-86849878ecc1"></div>
  </div>

  <!-- BOTTOM FIXED BANNER AD -->
  <div class="bottom-banner-container">
    <div style="font-size: 11px; color: #94a3b8; margin-bottom: 5px;">Mondiad Banner Ad (Zone 80626)</div>
    <div data-mndbanid="f18edcb6-dc5d-4230-ae93-257025a20165"></div>
  </div>

  <script>
    function showStatus(text) {
      document.getElementById('status-msg').innerText = text;
    }

    function loadScript(src, attrs = {}) {
      const script = document.createElement('script');
      script.async = true;
      script.src = src;
      for (const [k, v] of Object.entries(attrs)) {
        script.setAttribute(k, v);
      }
      document.head.appendChild(script);
    }

    // 1. Native Ad Trigger
    function triggerNative() {
      document.getElementById('native-container').style.display = 'block';
      loadScript('https://ss.mrmnd.com/native.js');
      showStatus('⚡ Native script loaded (Zone 80632). Ad displaying below.');
    }

    // 2. Interstitial Ad Trigger
    function triggerInterstitial() {
      loadScript('https://ss.mrmnd.com/interstitial.js', { 'data-mndintid': '2ef58810-d585-4fba-ba2a-bb2adcd29ff7' });
      showStatus('⚡ Interstitial script loaded (Zone 80627).');
    }

    // 3. Popunder Ad Trigger
    function triggerPopunder() {
      loadScript('https://ss.mrmnd.com/popunder.js', { 'data-mndpopid': '962e6f8c-77c1-4e17-bc44-b48a82991414' });
      showStatus('⚡ Popunder script loaded (Zone 80628). Click anywhere to trigger.');
    }

    // 4. Dynamic Ad Trigger (Floats top/bottom bar)
    function triggerDynamic() {
      loadScript('https://ss.mrmnd.com/dynamic.js', { 'data-mnddynid': '553a1e5c-81ac-4251-9fd7-47dec91a951f' });
      showStatus('⚡ Dynamic floating script loaded (Zone 80629).');
    }

    // 5. In-Page Push Trigger
    function triggerInPagePush() {
      loadScript('https://ss.mrmnd.com/static/6b5cc626-dcfa-42c8-9bfd-ee7ba8e4fc30.js');
      showStatus('⚡ In-Page Push script loaded (Zone 80630).');
    }

    // 6. Classic Push Trigger
    function triggerClassicPush() {
      loadScript('https://ss.mrmnd.com/static/49ef5365-1fc7-4d28-8a6c-681b152fb256.js');
      showStatus('⚡ Classic Push script loaded (Zone 80631).');
    }
  </script>

</body>
</html>
